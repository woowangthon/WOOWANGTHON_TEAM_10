# 푸시·PR 마다 타입 검사, 테스트(실제 PostgreSQL), 빌드를 돌린다.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mijuk
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: mijuk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mijuk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mijuk:devpass@localhost:5432/mijuk_test
      SESSION_SECRET: ci-only-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
